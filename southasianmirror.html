<title>South Asian Mirror</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#f3f5f9;--card:#fff;--tx:#17202e;--mut:#667085;--pri:#0d47a1;--pri2:#0a3a85;--bd:#e3e7ee;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131b;--card:#171e29;--tx:#e8ecf3;--mut:#9aa6b8;--pri:#4d8ff0;--pri2:#3a78d6;--bd:#273142;--on:#0e131b}}
:root[data-theme="dark"]{--bg:#0e131b;--card:#171e29;--tx:#e8ecf3;--mut:#9aa6b8;--pri:#4d8ff0;--pri2:#3a78d6;--bd:#273142;--on:#0e131b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Bengali',system-ui,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}.w{max-width:1080px;margin:auto;padding:0 14px}
header{background:var(--card);border-bottom:3px solid var(--pri)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}
.lg{background:#fff;border-radius:8px;padding:4px 8px;display:block}.lg img{height:54px;width:auto;display:block;max-width:100%}
.dt{font-size:13px;color:var(--mut);text-align:right}
nav{background:var(--pri)}nav .w{display:flex;overflow-x:auto}nav a{color:var(--on);padding:10px 13px;white-space:nowrap;font-weight:600}nav a:hover{background:var(--pri2)}
main{padding:18px 0 8px}.gr{display:grid;grid-template-columns:2fr 1fr;gap:18px}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.c{display:block;background:var(--card);border:1px solid var(--bd);padding:12px;border-radius:10px}
.c img,.ph{width:100%;height:160px;object-fit:cover;border-radius:7px;background:linear-gradient(135deg,#0d47a1,#42a5f5)}
.c h3{margin:8px 0 4px;font-size:18px;line-height:1.45}.c:hover h3{color:var(--pri)}.c p{margin:4px 0;color:var(--mut);font-size:15px}
.tg{display:inline-block;margin-top:8px;background:var(--pri);color:var(--on);font-size:12px;padding:0 8px;border-radius:4px}
small{color:var(--mut)}.ld h3{font-size:25px}.ld img,.ld .ph{height:280px}
h2.s{border-left:5px solid var(--pri);padding-left:10px;margin:26px 0 12px}
.bx{background:var(--card);border:1px solid var(--bd);padding:14px;border-radius:10px}.bx a{display:block;padding:8px 0;border-bottom:1px solid var(--bd)}
.art{background:var(--card);border:1px solid var(--bd);padding:22px;border-radius:10px;max-width:800px;margin:auto}.art h1{line-height:1.45}.art img{width:100%;border-radius:8px;margin-top:10px}.art p{font-size:18px}
footer{background:#18202c;color:#b6c0cf;text-align:center;padding:18px;margin-top:26px;font-size:14px}
input,textarea,select{width:100%;padding:10px;margin:6px 0 14px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}
.b{background:var(--pri);color:var(--on);border:0;padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit;display:inline-block;margin:2px}.b.g{background:#5b6677;color:#fff}
.fm{background:var(--card);border:1px solid var(--bd);padding:18px;border-radius:10px;max-width:700px;margin:auto}
table{width:100%;border-collapse:collapse;background:var(--card)}th,td{padding:9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
@media(max-width:760px){.gr{grid-template-columns:1fr}.ld img,.ld .ph{height:190px}.lg img{height:44px}}
</style></head><body><div id="root"></div>

const HEAD='<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>South Asian Mirror</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">';
const D=JSON.parse(document.getElementById('data').textContent);
const CATS=[['bangladesh','বাংলাদেশ'],['politics','রাজনীতি'],['economy','অর্থনীতি'],['sports','খেলা'],['entertainment','বিনোদন'],['technology','প্রযুক্তি'],['world','আন্তর্জাতিক']];
const MON=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const bn=s=>String(s).replace(/\d/g,x=>'০১২৩৪৫৬৭৮৯'[x]);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cn=k=>(CATS.find(c=>c[0]===k)||['',''])[1];
const fd=s=>{const d=new Date(s);return bn(d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear())};
const su=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
const all=()=>[...D.news].sort((a,b)=>b.id-a.id);
let OWNER=false;
function buildDoc(d){const css=document.getElementById('css').textContent,app=document.getElementById('app').textContent,j=JSON.stringify(d).replace(/</g,'\\u003c');
return '<!doctype html>'+HEAD+'<style id="css">'+css+'</style></head><body><div id="root"></div><script type="application/json" id="data">'+j+'<\/script><script id="app">'+app+'<\/script></body></html>';}
function card(a,big){const i=su(a.img);return '<a class="c" href="#news-'+a.id+'">'+(i?'<img src="'+i+'" alt="">':'<div class="ph"></div>')+'<span class="tg">'+esc(cn(a.c))+'</span><h3>'+esc(a.t)+'</h3>'+(big?'<p>'+esc(a.s)+'</p>':'')+'<small>'+fd(a.d)+'</small></a>';}
function home(){const n=all();if(!n.length)return '<p>এখনও কোনো সংবাদ নেই।</p>';const lead=n.find(x=>x.lead)||n[0],rest=n.filter(x=>x.id!==lead.id);
let h='<div class="gr"><div><div class="ld">'+card(lead,1)+'</div><div class="g3" style="margin-top:14px">'+rest.slice(0,4).map(a=>card(a)).join('')+'</div></div><aside><div class="bx"><h3 style="margin-top:0">সর্বশেষ</h3>'+n.slice(0,6).map((a,i)=>'<a href="#news-'+a.id+'">'+bn(i+1)+'। '+esc(a.t)+'</a>').join('')+'</div></aside></div>';
CATS.forEach(c=>{const it=n.filter(x=>x.c===c[0]).slice(0,3);if(it.length)h+='<h2 class="s"><a href="#cat-'+c[0]+'">'+c[1]+'</a></h2><div class="g3">'+it.map(a=>card(a)).join('')+'</div>';});return h;}
function catp(k){const it=all().filter(x=>x.c===k);return '<h2 class="s">'+esc(cn(k))+'</h2><div class="g3">'+(it.map(a=>card(a,1)).join('')||'<p>এই বিভাগে কোনো সংবাদ নেই।</p>')+'</div>';}
function newsp(id){const a=D.news.find(x=>x.id==id);if(!a)return '<p>সংবাদটি পাওয়া যায়নি।</p>';const i=su(a.img),rel=all().filter(x=>x.c===a.c&&x.id!==a.id).slice(0,3);
return '<article class="art"><span class="tg">'+esc(cn(a.c))+'</span><h1>'+esc(a.t)+'</h1><small>প্রকাশ: '+fd(a.d)+'</small>'+(i?'<img src="'+i+'" alt="">':'')+a.b.split('\n').filter(p=>p.trim()).map(p=>'<p>'+esc(p)+'</p>').join('')+'</article>'+(rel.length?'<h2 class="s">আরও পড়ুন</h2><div class="g3">'+rel.map(r=>card(r)).join('')+'</div>':'');}
function adminp(){if(!OWNER)return '<div class="fm"><h2>অ্যাডমিন</h2><p>শুধু সাইটের মালিক (যিনি এই পেজ বানিয়েছেন) নিজের অ্যাকাউন্টে লগইন করা অবস্থায় এখানে ঢুকতে পারবেন।</p></div>';
return '<p><a class="b" href="#new">+ নতুন সংবাদ</a></p><div style="overflow-x:auto"><table><tr><th>শিরোনাম</th><th>বিভাগ</th><th></th></tr>'+all().map(a=>'<tr><td>'+(a.lead?'⭐ ':'')+esc(a.t)+'</td><td>'+esc(cn(a.c))+'</td><td style="white-space:nowrap"><a class="b g" href="#edit-'+a.id+'">এডিট</a><button class="b" onclick="del('+a.id+')">মুছুন</button></td></tr>').join('')+'</table></div>';}
function formp(id){if(!OWNER)return adminp();return '<div class="fm"><h2>'+(id?'সংবাদ সম্পাদনা':'নতুন সংবাদ')+'</h2><label>শিরোনাম</label><input id="f_t"><label>সারসংক্ষেপ</label><textarea id="f_s" rows="2"></textarea><label>বিস্তারিত (প্রতি লাইনে একটি অনুচ্ছেদ)</label><textarea id="f_b" rows="9"></textarea><label>বিভাগ</label><select id="f_c">'+CATS.map(c=>'<option value="'+c[0]+'">'+c[1]+'</option>').join('')+'</select><label>ছবির লিংক (ঐচ্ছিক, https://...)</label><input id="f_i"><label><input type="checkbox" id="f_l" style="width:auto"> লিড নিউজ</label><br><br><button class="b" id="sv" onclick="submitF('+(id||0)+')">সংরক্ষণ</button><a class="b g" href="#admin">বাতিল</a></div>';}
function fill(id){const a=D.news.find(x=>x.id==id);if(!a)return;f_t.value=a.t;f_s.value=a.s;f_b.value=a.b;f_c.value=a.c;f_i.value=a.img||'';f_l.checked=!!a.lead;}
async function save(){try{const a=await claude.use('artifact');if(!a)throw{code:'x'};await a.publish(buildDoc(D));}catch(e){alert(e&&(e.code==='not_writer'||e.code==='not_granted')?'সংরক্ষণের অনুমতি নেই।':'সংরক্ষণ হয়নি, আবার চেষ্টা করুন।');const b=document.getElementById('sv');if(b)b.disabled=false;}}
function submitF(id){const t=f_t.value.trim(),b=f_b.value.trim();if(!t||!b){alert('শিরোনাম ও বিস্তারিত লিখুন');return;}
document.getElementById('sv').disabled=true;const lead=f_l.checked;if(lead)D.news.forEach(x=>x.lead=false);
const v={t:t,s:f_s.value.trim(),b:b,c:f_c.value,img:f_i.value.trim(),lead:lead};
if(id){Object.assign(D.news.find(x=>x.id==id),v);}else{D.news.push(Object.assign({id:D.nextId++,d:new Date().toISOString().slice(0,16)},v));}
location.hash='admin';save();}
function del(id){if(!confirm('মুছে ফেলবেন?'))return;D.news=D.news.filter(x=>x.id!==id);save();}
function render(){const h=location.hash.slice(1),m=h.split('-'),k=m[0],arg=m.slice(1).join('-');let body;
if(k==='cat')body=catp(arg);else if(k==='news')body=newsp(arg);else if(k==='admin')body=adminp();else if(k==='new')body=formp(0);else if(k==='edit')body=formp(arg);else body=home();
const d=new Date(),today=bn(d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear());
document.getElementById('root').innerHTML='<header><div class="w top"><a class="lg" href="#home"><img src="data:image/webp;base64,'+LOGO+'" alt="South Asian Mirror"></a><span class="dt">'+today+'</span></div></header><nav><div class="w"><a href="#home">প্রথম পাতা</a>'+CATS.map(c=>'<a href="#cat-'+c[0]+'">'+c[1]+'</a>').join('')+(OWNER?'<a href="#admin">অ্যাডমিন</a>':'')+'</div></nav><main><div class="w">'+body+'</div></main><footer>© South Asian Mirror</footer>';
if(k==='edit'&&OWNER)fill(arg);if(k==='home'||!k||k==='cat'||k==='news')window.scrollTo(0,0);}
window.addEventListener('hashchange',render);render();
(async()=>{try{if(window.claude){const u=await claude.use('user');if(u){OWNER=await u.isOwner();if(OWNER)render();}}}catch(e){}})();
</script></body></html>
